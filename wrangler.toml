name = "clearwatergroup"
main = "src/server/worker.ts"
compatibility_date = "2025-01-01"

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "clearwater-db"
database_id = "placeholder-id"
migrations_dir = "drizzle"

[[routes]]
pattern = "clearwatergroup.com/demo"
custom_domain = true

[[routes]]
pattern = "clearwatergroup.com/demo/*"
custom_domain = true
